<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ORVIX STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4fb; --surface:#ffffff; --raised:#eceefb; --line:#e2e5f6;
  --text:#0d1030; --muted:#6b7099; --accent:#5b3df5; --accent-ink:#ffffff; --accent-soft:rgba(91,61,245,.10);
  --ok:#0fa77a; --bad:#e8344f; --gold:#ffc24a;
  --shadow:0 12px 32px rgba(70,50,170,.14); --shadow-sm:0 4px 14px rgba(70,50,170,.10);
  --display:'Sora','Noto Sans Devanagari',system-ui,sans-serif;
  --body:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[data-theme="dark"]{
  --bg:#0a0b17; --surface:#141730; --raised:#1d2144; --line:#282c55;
  --text:#f1f2ff; --muted:#9a9dcb; --accent:#7f66ff; --accent-ink:#ffffff; --accent-soft:rgba(127,102,255,.16);
  --ok:#2bd9a6; --bad:#ff6b80; --gold:#ffc24a;
  --shadow:0 14px 34px rgba(0,0,0,.5); --shadow-sm:0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font-family:inherit;font-size:16px;color:var(--text)}
img{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{min-height:100%;padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.hide{display:none!important}

/* ---------- splash / gate ---------- */
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:28px}
.logo{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.5px}
.logo b{color:var(--accent)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.splash p{color:var(--muted);max-width:290px}
.gate h2{font-family:var(--display);font-size:21px}
.gate .ch{width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px;margin-top:6px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.brand{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.2px}
.brand b{color:var(--accent)}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.pill svg{width:16px;height:16px;color:var(--accent)}
.page-title{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.5px;padding:10px 16px 0}

/* ---------- hero ---------- */
.hero{margin:8px 16px 0;border-radius:28px;padding:22px 20px 18px;color:#fff;background:linear-gradient(135deg,#5b3df5 0%,#8a3ff0 48%,#ff4f8b 100%);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::before{content:'';position:absolute;right:-46px;top:-46px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::after{content:'';position:absolute;right:38px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero small{display:block;font-weight:600;opacity:.85;font-size:13px}
.hero h1{font-family:var(--display);font-weight:800;font-size:27px;line-height:1.15;letter-spacing:-.6px;margin:2px 0 6px;position:relative}
.hero p{opacity:.92;font-size:14px;max-width:80%;position:relative}
.hero .hc{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative}
.hero .hc span{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600}
.hero .hc svg{width:14px;height:14px}

/* ---------- search + chips ---------- */
.search{margin:14px 16px 0;display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:var(--shadow-sm);border-radius:18px;padding:0 14px}
.search svg{width:19px;height:19px;color:var(--muted);flex:none}
.search input{flex:1;background:none;border:0;outline:0;padding:14px 0}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;background:var(--surface);font-weight:600;font-size:13.5px;color:var(--muted);box-shadow:var(--shadow-sm)}
.chip.on{background:var(--accent);color:var(--accent-ink)}

/* ---------- sections ---------- */
.sec{padding:22px 16px 0}
.sec h3{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.3px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 span{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.rail{display:flex;gap:14px;overflow-x:auto;padding:0 16px 6px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:64%;max-width:260px;scroll-snap-align:start}
.rail .card:first-child{margin-left:16px}
.rail .card:last-child{margin-right:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}

/* ---------- product card (image first, no box) ---------- */
.card{display:flex;flex-direction:column;text-align:left;gap:9px;transition:transform .12s}
.card:active{transform:scale(.97)}
.thumb{position:relative;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:var(--raised);box-shadow:var(--shadow-sm)}
.rail .thumb{aspect-ratio:4/3}
.thumb img,.thumb .ph,.slide img,.slide .ph{position:absolute;inset:0;width:100%;height:100%}
.thumb img,.slide img{object-fit:cover}
.slide{position:relative}
.ph{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:46px;color:rgba(255,255,255,.92)}
.tag{position:absolute;left:10px;bottom:10px;background:var(--surface);color:var(--accent);font-weight:800;font-size:13.5px;padding:6px 12px;border-radius:999px;box-shadow:var(--shadow-sm)}
.tag.free{background:var(--ok);color:#fff}
.sold{position:absolute;inset:0;background:rgba(8,10,28,.66);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.cbody{padding:0 3px;display:flex;flex-direction:column;gap:2px}
.cname{font-weight:700;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{font-size:12.5px;color:var(--muted)}
.star{color:var(--gold)}

/* ---------- banners / boxes ---------- */
.pro{margin:20px 16px 0;border-radius:24px;padding:16px 18px;background:linear-gradient(120deg,#14173a,#2c2170);color:#fff;display:flex;gap:14px;align-items:center;text-align:left;width:calc(100% - 32px);box-shadow:var(--shadow)}
.pro svg{width:34px;height:34px;flex:none;color:var(--gold)}
.pro b{display:block;font-family:var(--display);font-size:16px}
.pro span{font-size:13px;opacity:.85}
.box{background:var(--surface);border-radius:24px;padding:16px;box-shadow:var(--shadow-sm)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:44px 24px}
.empty b{display:block;color:var(--text);font-family:var(--display);font-size:17px;margin-bottom:4px}
.lbl{font-weight:700;margin-bottom:8px}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 16px;border-radius:18px;font-weight:700;font-size:15.5px;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px var(--accent-soft)}
.btn.alt{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.ghost{background:none;color:var(--muted);box-shadow:none;border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.stack{display:flex;flex-direction:column;gap:10px}

/* ---------- floating tab bar ---------- */
.tabs{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:4px;background:var(--surface);border-radius:28px;padding:7px;box-shadow:var(--shadow);border:1px solid var(--line)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 0;font-size:13px;font-weight:700;color:var(--muted);border-radius:22px;transition:flex .2s,background .2s}
.tab svg{width:22px;height:22px;flex:none}
.tab span{display:none}
.tab.on{flex:2.1;background:var(--accent);color:var(--accent-ink)}
.tab.on span{display:inline}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(6,8,24,.55);opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94%;background:var(--bg);border-radius:30px 30px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 4px;flex:none}
.sbody{overflow-y:auto;padding:8px 16px 18px;flex:1}
.sfoot{padding:14px 16px calc(16px + env(safe-area-inset-bottom));background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -8px 24px rgba(70,50,170,.08);flex:none}
.sheet h2{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.4px;line-height:1.2}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:24px;scrollbar-width:none;background:var(--raised);aspect-ratio:4/3}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:none;width:100%;scroll-snap-align:center}
.dots{display:flex;justify-content:center;gap:5px;margin:10px 0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:18px;border-radius:6px}
.price{font-family:var(--display);font-weight:800;font-size:27px;color:var(--accent);letter-spacing:-.5px}
.price s{font-size:15px;color:var(--muted);font-weight:600;margin-left:6px}
.desc{white-space:pre-wrap;opacity:.88;margin-top:10px}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.facts span{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.coupon{display:flex;gap:8px;margin-top:12px}
.coupon input{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;outline:0;text-transform:uppercase}
.coupon input:focus{border-color:var(--accent)}
.note{font-size:13px;margin-top:6px}
.note.ok{color:var(--ok)}
.review{padding:12px 0;border-top:1px solid var(--line)}
.review:first-child{border-top:0}
.review p{margin-top:3px;opacity:.9}

/* ---------- list rows ---------- */
.li{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:800;white-space:nowrap}
.amt.cr{color:var(--ok)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted)}
.badge.ok{background:rgba(15,167,122,.14);color:var(--ok)}
.badge.bad{background:rgba(232,52,79,.12);color:var(--bad)}
.badge.wait{background:rgba(255,194,74,.2);color:#b87a00}

/* ---------- wallet ---------- */
.wcard{border-radius:28px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,#1b1650 0%,#4a2fc7 60%,#7f4af0 100%);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.wcard::after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1)}
.wcard small{opacity:.8}
.wcard .bal{font-family:var(--display);font-weight:800;font-size:42px;letter-spacing:-1.5px;position:relative}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative}
.amts button{padding:11px 0;border-radius:14px;background:rgba(255,255,255,.14);font-weight:700;color:#fff}
.amts button.on{background:#fff;color:#2d1d9a}
.wcard .field{background:rgba(255,255,255,.14);border:0;color:#fff;margin-top:10px;position:relative}
.wcard .field::placeholder{color:rgba(255,255,255,.7)}
.wcard .btn{background:#fff;color:#2d1d9a;margin-top:12px;position:relative;box-shadow:none}
.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;outline:0}
.field:focus{border-color:var(--accent)}

/* ---------- stars / modal / toast ---------- */
.stars{display:flex;gap:6px;font-size:36px;justify-content:center;margin:6px 0 12px}
.stars button{color:var(--line);line-height:1}
.stars button.on{color:var(--gold)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(6,8,24,.7);display:flex;align-items:center;justify-content:center;padding:22px}
.mbox{background:var(--bg);border-radius:30px;padding:26px 20px 20px;width:100%;max-width:360px;text-align:center;box-shadow:var(--shadow)}
.mbox h2{font-size:21px;margin:12px 0 4px}
.mbox p{color:var(--muted);margin-bottom:16px}
.mic{width:62px;height:62px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.mic svg{width:30px;height:30px}
.mic.ok{background:rgba(15,167,122,.15);color:var(--ok)}
.mic.bad{background:rgba(232,52,79,.12);color:var(--bad)}
.mic .spin{width:30px;height:30px}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:16px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- profile ---------- */
.av{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:26px;color:#fff;flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.kv div{background:var(--bg);border-radius:18px;padding:12px 6px;text-align:center}
.kv b{display:block;font-family:var(--display);font-size:18px}
.kv span{font-size:12px;color:var(--muted)}
.reflink{word-break:break-all;font-size:13px;background:var(--bg);padding:11px 13px;border-radius:14px;margin:10px 0}
.seg{display:flex;background:var(--bg);border-radius:16px;padding:4px;margin-bottom:14px}
.seg:last-child{margin-bottom:0}
.seg button{flex:1;padding:10px 6px;border-radius:12px;font-weight:700;color:var(--muted);font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>

/* ===================== API ===================== */
class GateError extends Error {}
async function api(path, body, timeoutMs) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
  try {
    const r = await fetch(API_BASE + '/api/mini' + path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Init-Data': INIT, 'X-Lang': LANG },
      body: body === undefined ? undefined : JSON.stringify(body),
      signal: ctrl.signal
    });
    const j = await r.json().catch(() => ({ ok:false, code:'SERVER' }));
    if (!j.ok && ['JOIN_REQUIRED','MAINTENANCE','BANNED','AUTH'].includes(j.code)) { showGate(j); throw new GateError(j.code); }
    return j;
  } finally { clearTimeout(to); }
}

/* ===================== BOOT ===================== */
async function boot() {
  $('#splashMsg').textContent = t('splash_loading');
  if (!tg || !INIT) {
    $('#splash').innerHTML = `<div class="logo">ORVIX <b>STORE</b></div><p>${esc(t('open_in_tg', { name: STORE_NAME }))}</p>`;
    return;
  }
  let lastErr = '';
  for (let i = 0; i < 4; i++) {
    try {
      if (i > 0) $('#splashMsg').textContent = t('splash_wake');
      const j = await api('/bootstrap', undefined, 45000);
      if (j.ok) { applyBootstrap(j); return start(); }
      lastErr = errText(j); break;
    } catch (e) {
      if (e instanceof GateError) return;
      lastErr = t('net_err'); await wait(1500);
    }
  }
  $('#splash').innerHTML = `<div class="logo">ORVIX <b>STORE</b></div><p>${esc(lastErr)}</p><button class="btn sm" id="retry">${esc(t('retry'))}</button>`;
  $('#retry').onclick = () => location.reload();
}
function applyBootstrap(j) {
  S.user = j.user; S.products = j.products; S.categories = j.categories; S.settings = j.settings;
  S.botUsername = j.botUsername; S.isAdmin = j.isAdmin; S.startParam = j.startParam || '';

  closeSheet(true);
  $('#layer').insertAdjacentHTML('beforeend', `<div class="backdrop" id="bd" data-act="closesheet"></div>
    <div class="sheet" id="sh" role="dialog" aria-modal="true"><div class="grab"></div><div class="sbody" id="sb">${inner}</div>${foot ? `<div class="sfoot" id="sf">${foot}</div>` : ''}</div>`);
  requestAnimationFrame(() => { $('#bd').classList.add('show'); $('#sh').classList.add('show'); });
  if (tg) { tg.BackButton.show(); tg.BackButton.offClick(closeSheet); tg.BackButton.onClick(closeSheet); }
}
function closeSheet(instant) {
  const sh = $('#sh'), bd = $('#bd');
  if (!sh) return;
  P.id = null;
  if (instant === true) { sh.remove(); bd && bd.remove(); }
  else { sh.classList.remove('show'); bd && bd.classList.remove('show'); setTimeout(() => { sh.remove(); bd && bd.remove(); }, 230); }
  if (tg && !PAY) tg.BackButton.hide();
}

/* ===================== PRODUCT ===================== */
async function openProduct(id) {
  haptic();
  P.id = id; P.data = null; P.coupon = null; P.busy = false;
  const base = S.products.find(p => p.id === id);
  openSheet(`<div class="empty"><div class="spin" style="margin:0 auto 12px"></div>${esc(base ? base.name : '')}</div>`);
  let j;
  try { j = await api('/product/' + encodeURIComponent(id)); } catch(e) { closeSheet(); return; }
  if (P.id !== id) return;
  if (!j.ok) { closeSheet(); return toast(errText(j), 'err'); }
  P.data = j; drawProduct();
}
function drawProduct() {
  const { product:p, reviews, owned, canReview } = P.data;
  const u = S.user, free = p.price === 0, vip = !free && u.isVip;
  const final = free || vip ? 0 : (P.coupon ? P.coupon.final : p.price);
  const phd = `<div class="ph" style="${phStyle(p.name)}">${esc(p.name.charAt(0).toUpperCase())}</div>`;
  const gal = p.images.length
    ? `<div class="gal" id="gal">${p.images.map(src => `<div class="slide">${phd}<img src="${API_BASE}${esc(src)}" alt="" onerror="this.remove()"></div>`).join('')}</div>
       ${p.images.length > 1 ? `<div class="dots" id="dots">${p.images.map((_,i) => `<i class="${i?'':'on'}"></i>`).join('')}</div>` : ''}`
    : `<div class="gal"><div class="slide">${phd}</div></div>`;

  let body = `${gal}<div style="margin-top:14px"><h2>${esc(p.name)}</h2>
    <div class="facts"><span>${esc(p.category)}</span>${p.reviewCount ? `<span>★ ${p.rating.toFixed(1)} (${p.reviewCount})</span>` : ''}${p.stock !== -1 ? `<span>${esc(p.soldOut ? t('out_stock') : t('left', { n: p.stock }))}</span>` : ''}<span>${esc(t('views', { n: p.views }))}</span></div>
    <div class="desc">${esc(p.description)}</div>
    ${p.customButtonText && p.customButtonUrl ? `<button class="btn alt" style="margin-top:12px" data-act="openlink" data-u="${esc(p.customButtonUrl)}">${esc(p.customButtonText)} ${ico('ext')}</button>` : ''}</div>`;
  body += `<div style="margin-top:22px"><div class="row between" style="margin-bottom:6px"><b style="font-family:var(--display);font-size:17px">${esc(t('reviews'))}</b>${canReview ? `<button class="btn sm alt" data-act="review">${esc(t('write_review'))}</button>` : ''}</div>${
    reviews.length ? reviews.map(r => `<div class="review"><div class="row between"><b>${esc(r.name)}${r.mine ? ` <span class="badge ok">${esc(t('you'))}</span>` : ''}</b><span class="star">${'★'.repeat(r.rating)}<span style="color:var(--line)">${'★'.repeat(5 - r.rating)}</span></span></div>${r.comment ? `<p>${esc(r.comment)}</p>` : ''}</div>`).join('') : `<div class="muted" style="padding:8px 0">${esc(t('no_reviews'))}</div>`}</div>`;

  let foot;
  const shareBtn = `<button class="btn alt sm" data-act="shareprod" aria-label="${esc(t('share'))}">${ico('share')}</button>`;
  if (owned) {
    foot = `<div class="row"><button class="btn" data-act="redeliver" data-id="${esc(P.data.orderId)}">${ico('down')} ${esc(t('resend'))}</button>${shareBtn}</div>`;
  } else if (p.soldOut) {
    foot = `<button class="btn" disabled>${esc(t('out_stock'))}</button>`;
  } else if (free) {
    foot = `<div class="row between" style="margin-bottom:10px"><span class="price">${esc(t('free_word'))}</span>${shareBtn}</div><button class="btn ok" data-act="buy" data-m="free">${esc(t('get_free'))}</button>`;
  } else if (vip) {
    foot = `<div class="row between" style="margin-bottom:10px"><span class="price">${esc(t('vip_free'))}<s>${rs(p.price)}</s></span>${shareBtn}</div><button class="btn ok" data-act="buy" data-m="free">${ico('crown')} ${esc(t('vip_get'))}</button>`;
  } else {
    const enough = u.balance >= final;
    foot = `<div class="row between"><span class="price">${rs(final)}${P.coupon ? `<s>${rs(p.price)}</s>` : ''}</span>${shareBtn}</div>
      <div class="coupon"><input id="cpn" placeholder="${esc(t('coupon_ph'))}" value="${P.coupon ? esc(P.coupon.code) : ''}" ${P.coupon ? 'readonly' : ''} autocapitalize="characters"><button class="btn alt sm" data-act="${P.coupon ? 'rmcoupon' : 'coupon'}">${esc(P.coupon ? t('remove') : t('apply'))}</button></div>
      ${P.coupon ? `<div class="note ok">${esc(t('coupon_ok', { code: P.coupon.code, amt: rs(P.coupon.discount) }))}</div>` : ''}
      <div class="stack" style="margin-top:12px">
        ${final === 0 ? `<button class="btn ok" data-act="buy" data-m="upi">${esc(t('get_free'))}</button>` : `
        <button class="btn" data-act="buy" data-m="upi">${esc(t('pay_upi', { amt: rs(final) }))}</button>
        <button class="btn alt" data-act="buy" data-m="wallet">${esc(enough ? t('pay_wallet', { bal: rs(u.balance) }) : t('wallet_low', { bal: rs(u.balance) }))}</button>`}
      </div>`;
  }
  $('#sb').innerHTML = body;
  const sf = $('#sf');
  if (sf) sf.innerHTML = foot; else $('#sh').insertAdjacentHTML('beforeend', `<div class="sfoot" id="sf">${foot}</div>`);
  const g = $('#gal'), d = $('#dots');
  if (g && d) g.addEventListener('scroll', () => { const i = Math.round(g.scrollLeft / g.clientWidth); [...d.children].forEach((x, k) => x.classList.toggle('on', k === i)); }, { passive:true });
}

async function doBuy(method) {
  if (P.busy || !P.data) return;
  P.busy = true;
  const p = P.data.product;
  const btns = document.querySelectorAll('#sf .btn'); btns.forEach(b => b.setAttribute('disabled',''));
  try {
    const j = await api('/buy', { productId: p.id, method, coupon: P.coupon ? P.coupon.code : undefined }, 45000);
    if (!j.ok) {
      if (j.code === 'LOW_BALANCE') {
        toast(t('low_bal', { bal: rs(j.balance || 0), need: rs(j.need || 0) }), 'err');
        closeSheet(); S.topupAmt = Math.max(10, Math.ceil((j.need || 100) - (j.balance || 0))); setTab('wallet'); return;
      }
      toast(errText(j), 'err'); return;
    }
    if (j.status === 'owned') { toast(t('owned')); P.data.owned = true; drawProduct(); return; }
    if (j.status === 'pending') { startPay({ orderId: j.orderId, url: j.paymentUrl, kind:'product', amount: j.amount, title: p.name }); return; }
    if (typeof j.balance === 'number') S.user.balance = j.balance;
    S.orders = null;
    showDone({ title: p.name, delivered: j.delivered, link: j.link, kind:'product' });
    P.data.owned = true; P.data.orderId = j.orderId; P.data.canReview = true;
    refresh();
  } catch(e) { if (!(e instanceof GateError)) toast(t('net_toast'), 'err'); }
  finally { P.busy = false; if ($('#sf') && P.data && !P.data.owned) btns.forEach(b => b.removeAttribute('disabled')); }
}

/* ===================== PAYMENT FLOW ===================== */
function startPay(o) {
  stopPay();
  PAY = Object.assign({ started: Date.now(), timer: null, busy: false }, o);
  drawPay('wait'); openLink(o.url);
  PAY.timer = setInterval(() => checkPay(false), 3500);
}
function stopPay() { if (PAY && PAY.timer) clearInterval(PAY.timer); }
function modal() { if (!$('#pm')) $('#layer').insertAdjacentHTML('beforeend', '<div class="modal" id="pm"><div class="mbox" id="pb"></div></div>'); }
function drawPay(state) {
  modal();
  let h = '';
  if (state === 'wait') {
    h = `<div class="mic"><div class="spin"></div></div><h2>${esc(t('pay_wait_t'))}</h2><p>${esc(PAY.title)} · ${rs(PAY.amount)}<br>${esc(t('pay_wait_s'))}</p>
      <div class="stack"><button class="btn" data-act="paycheck">${esc(t('i_paid'))}</button><button class="btn alt" data-act="payreopen">${ico('ext')} ${esc(t('open_pay'))}</button><button class="btn ghost" data-act="paycancel">${esc(t('cancel'))}</button></div>`;
  } else if (state === 'fail') {
    h = `<div class="mic bad">${ico('x')}</div><h2>${esc(t('pay_fail_t'))}</h2><p>${esc(t('pay_fail_s'))}</p><button class="btn" data-act="payclose">${esc(t('ok_btn'))}</button>`;
  } else {
    h = `<div class="mic bad">${ico('x')}</div><h2>${esc(t('pay_to_t'))}</h2><p>${esc(t('pay_to_s'))}</p><button class="btn" data-act="payclose">${esc(t('ok_btn'))}</button>`;
  }
  $('#pb').innerHTML = h;
}
async function checkPay(manual) {
  if (!PAY || PAY.busy) return;
  if (Date.now() - PAY.started > 15 * 60 * 1000) { stopPay(); return drawPay('timeout'); }
  PAY.busy = true;
  try {
    const j = await api('/order/' + PAY.orderId);
    if (!PAY) return;
    if (j.ok && (j.status === 'paid' || j.status === 'delivered')) {
      const o = PAY; stopPay(); PAY = null; $('#pm') && $('#pm').remove();
      if (j.user) S.user = j.user;
      S.orders = null; S.wallet = null; closeSheet(true);
      if (o.kind === 'topup') showDone({ title: t('topup_done', { amt: rs(o.amount) }), kind:'topup' });
      else if (o.kind === 'pro') showDone({ title: t('pro_done'), kind:'pro' });
      else showDone({ title: o.title, delivered: true, link: j.link, kind:'product' });
      refresh();
    } else if (j.ok && j.status === 'failed') { stopPay(); drawPay('fail'); }
    else if (manual) toast(t('not_conf'));
  } catch(e) { /* keep polling */ }
  finally { if (PAY) PAY.busy = false; }
}
async function cancelPay() {
  if (!PAY) return;
  const id = PAY.orderId; stopPay(); PAY = null; $('#pm') && $('#pm').remove();
  try { await api('/order/' + id + '/cancel', {}); } catch(e){}
  if (tg && !$('#sh')) tg.BackButton.hide();
}
function closePay() { stopPay(); PAY = null; $('#pm') && $('#pm').remove(); if (tg && !$('#sh')) tg.BackButton.hide(); }
function showDone(o) {
  modal();
  const msg = o.kind === 'product' ? (o.delivered ? t('msg_deliv') : t('msg_nodeliv')) : o.kind === 'topup' ? t('msg_topup') : t('msg_pro');
  $('#pb').innerHTML = `<div class="mic ok">${ico('check')}</div><h2>${esc(o.kind==='product' ? t('done_got') : t('done_ok'))}</h2><p><b>${esc(o.title)}</b><br>${esc(msg)}</p>
    <div class="stack">${o.link ? `<button class="btn" data-act="openlink" data-u="${esc(o.link)}">${ico('ext')} ${esc(t('open_link'))}</button>` : ''}
    ${o.kind==='product' ? `<button class="btn alt" data-act="tgclose">${esc(t('see_chat'))}</button>` : ''}<button class="btn ${o.link?'ghost':''}" data-act="payclose">${esc(t('stay'))}</button></div>`;
  haptic('ok');
}

/* ===================== OTHER FLOWS ===================== */
async function doTopup() {
  const inp = $('#topupCustom'); if (inp && inp.value) S.topupAmt = parseInt(inp.value, 10) || S.topupAmt;
  if (!(S.topupAmt >= 10)) return toast(t('min_topup'), 'err');
  try {
    const j = await api('/topup', { amount: S.topupAmt }, 40000);
    if (!j.ok) return toast(errText(j), 'err');
    startPay({ orderId: j.orderId, url: j.paymentUrl, kind:'topup', amount: j.amount, title: t('tx_topup') });
  } catch(e) { if (!(e instanceof GateError)) toast(t('net_toast'), 'err'); }
}
function doPro() {
  const pro = S.settings.pro;
  openSheet(`<h2>${esc(t('vip_plan'))}</h2><div class="muted" style="margin:6px 0 14px">${esc(pro.description || '')}</div>
    <div class="box stack" style="gap:10px"><div>✅ ${esc(t('pro_f1', { n: pro.durationDays }))}</div><div>✅ ${esc(t('pro_f2'))}</div><div>✅ ${esc(t('pro_f3'))}</div><div>✅ ${esc(t('pro_f4'))}</div></div>
    <div class="note muted" style="margin-top:12px">${esc(S.settings.terms || '')}</div>`,
    `<div class="row between" style="margin-bottom:10px"><span class="price">${rs(pro.price)}</span><span class="muted">${esc(t('days_word', { n: pro.durationDays }))}</span></div><button class="btn" data-act="propay">${esc(S.user.isVip ? t('extend_pay') : t('get_vip'))}</button>`);
}
async function doProPay() {
  try {
    const j = await api('/pro', {}, 40000);
    if (!j.ok) return toast(errText(j), 'err');
    closeSheet(true);
    startPay({ orderId: j.orderId, url: j.paymentUrl, kind:'pro', amount: j.amount, title: t('vip_plan') });
  } catch(e) { if (!(e instanceof GateError)) toast(t('net_toast'), 'err'); }
}
async function doCheckin() {
  try {
    const j = await api('/checkin', {});
    if (j.success) { toast(t('checkin_got', { amt: rs(j.bonus), n: j.streak }), 'ok'); S.user.balance = j.balance; S.user.checkedInToday = true; S.user.streak = j.streak; S.wallet = null; }
    else if (j.reason === 'already_checked_in') { S.user.checkedInToday = true; toast(t('checkin_already')); }
    else toast(t('checkin_na'));
    renderTab();
  } catch(e) {}
}
function doReview() {
  let rating = 0;
  P.reviewFor = P.data.product.id;
  openSheet(`<h2>${esc(t('write_review'))}</h2><div class="muted" style="margin:4px 0 8px">${esc(P.data.product.name)}</div>
    <div class="stars" id="stars">${[1,2,3,4,5].map(n => `<button data-n="${n}" aria-label="${n}">★</button>`).join('')}</div>
    <textarea id="rc" class="field" rows="4" maxlength="300" placeholder="${esc(t('review_ph'))}"></textarea>`,
    `<button class="btn" data-act="sendreview">${esc(t('send_review'))}</button>`);
  $('#sh')._rating = () => rating;
  $('#stars').addEventListener('click', e => { const b = e.target.closest('[data-n]'); if (!b) return; rating = +b.dataset.n; [...$('#stars').children].forEach((x,i) => x.classList.toggle('on', i < rating)); haptic(); });
}
async function sendReview() {
  const sh = $('#sh'); const rating = sh && sh._rating ? sh._rating() : 0;
  if (!rating) return toast(t('pick_stars'), 'err');
  const id = P.reviewFor;
  try {
    const j = await api('/review', { productId: id, rating, comment: ($('#rc')||{}).value || '' });
    if (!j.ok) return toast(errText(j), 'err');
    toast(t('review_thanks'), 'ok'); closeSheet(true); openProduct(id);
  } catch(e){}
}
function doRefund(orderId) {
  openSheet(`<h2>${esc(t('refund_t'))}</h2><div class="muted" style="margin:4px 0 12px">${esc(t('refund_s'))}</div>
    <textarea id="rr" class="field" rows="4" maxlength="300" placeholder="${esc(t('reason_ph'))}"></textarea>`,
    `<button class="btn" data-act="sendrefund" data-id="${esc(orderId)}">${esc(t('send_req'))}</button>`);
}
async function sendRefund(id) {
  const reason = ($('#rr')||{}).value || '';
  if (reason.trim().length < 5) return toast(t('reason_short'), 'err');
  try {
    const j = await api('/refund', { orderId: id, reason });
    if (!j.ok) return toast(errText(j), 'err');
    toast(t('refund_sent'), 'ok'); S.orders = null; closeSheet(); if (S.tab === 'orders') renderTab();
  } catch(e){}
}
async function doLeaderboard() {
  openSheet('<div class="empty"><div class="spin" style="margin:0 auto"></div></div>');
  let j; try { j = await api('/leaderboard'); } catch(e){ return closeSheet(); }
  if (!j.ok) { closeSheet(); return toast(errText(j), 'err'); }
  let tab = 'b';
  const draw = () => {
    const rows = tab === 'b' ? j.buyers.map(b => [b.name, rs(b.totalSpent), b.me]) : j.referrers.map(r => [r.name, t('invites', { n: r.referralCount }), r.me]);
    $('#sb').innerHTML = `<h2 style="margin-bottom:12px">${esc(t('leaderboard'))}</h2><div class="seg"><button class="${tab==='b'?'on':''}" data-lb="b">${esc(t('top_buyers'))}</button><button class="${tab==='r'?'on':''}" data-lb="r">${esc(t('top_refs'))}</button></div>
      ${rows.length ? `<div class="box" style="padding:4px 16px">${rows.map((r,i) => `<div class="li"><b style="width:26px;color:var(--muted)">${i+1}</b><div class="grow t">${esc(r[0])}${r[2] ? ` <span class="badge ok">${esc(t('you'))}</span>` : ''}</div><div class="amt">${esc(r[1])}</div></div>`).join('')}</div>` : `<div class="empty">${esc(t('no_data'))}</div>`}`;
    $('#sb').querySelectorAll('[data-lb]').forEach(b => b.onclick = () => { tab = b.dataset.lb; draw(); });
  };
  draw();
}

/* ===================== EVENTS ===================== */
const ACT = {
  tab: d => setTab(d.k),
  cat: d => { S.cat = d.c; renderTab(); },
  product: d => openProduct(d.id),
  closesheet: () => closeSheet(),
  lang: d => { LANG = d.l; store.set('orvix_lang', LANG); applyTheme(); renderTabs(); renderTab(); haptic(); },
  theme: d => { THEME = d.m; store.set('orvix_theme', THEME); applyTheme(); renderTab(); haptic(); },
  buy: d => doBuy(d.m),
  coupon: async () => {
    const code = ($('#cpn')||{}).value || '';
    if (!code.trim()) return toast(t('e_NO_CODE'), 'err');
    const j = await api('/coupon', { code, productId: P.id });
    if (!j.ok) return toast(errText(j), 'err');
    P.coupon = j; drawProduct(); haptic('ok');
  },
  rmcoupon: () => { P.coupon = null; drawProduct(); },
  shareprod: () => {
    if (!S.botUsername || !P.data) return;
    const url = `https://t.me/${S.botUsername}?start=PROD_${P.data.product.id}`;
    openTg(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(P.data.product.name)}`);
  },
  review: doReview, sendreview: sendReview,
  redeliver: async d => {
    try { const j = await api('/redeliver', { orderId: d.id }); toast(j.ok ? t('resent') : errText(j), j.ok ? 'ok' : 'err'); } catch(e){}
  },
  refund: d => doRefund(d.id), sendrefund: d => sendRefund(d.id),
  amt: d => { S.topupAmt = +d.a; renderTab(); },
  topup: doTopup, checkin: doCheckin, pro: doPro, propay: doProPay,
  paycheck: () => checkPay(true), payreopen: () => PAY && openLink(PAY.url), paycancel: cancelPay, payclose: closePay,
  lb: doLeaderboard,
  shareref: () => openTg(`https://t.me/share/url?url=${encodeURIComponent(S.user.referralLink)}&text=${encodeURIComponent(t('share_text'))}`),
  copyref: () => { (navigator.clipboard ? navigator.clipboard.writeText(S.user.referralLink) : Promise.reject()).then(() => toast(t('copied'), 'ok')).catch(() => toast(S.user.referralLink)); },
  openlink: d => openLink(d.u), tglink: d => openTg(d.u),
  tgclose: () => { try { tg.close(); } catch(e){} },
  joinch: d => openTg('https://t.me/' + String(d.u).replace('@','')),
  reload: () => location.reload()
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.hasAttribute('disabled')) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); Promise.resolve(fn(el.dataset, el)).catch(err => { if (!(err instanceof GateError)) console.error(err); }); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(renderTab, 180); }
  if (e.target.id === 'topupCustom') {
    const v = parseInt(e.target.value, 10);
    if (v) { S.topupAmt = v; const b = document.querySelector('.wcard .btn'); if (b) b.textContent = t('add_upi', { amt: rs(v) }); document.querySelectorAll('.amts button').forEach(x => x.classList.remove('on')); }
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && PAY) checkPay(false); });

boot();
})();
</script>
</body>
