<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Diya Utsav · Admin</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;padding:18px;font-family:system-ui,sans-serif;background:#12030a;color:#fff4dc;max-width:560px;margin-inline:auto}
h1{color:#ffc857;font-size:1.4rem}h3{color:#ffc857;margin:0 0 4px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
label{display:block;font-size:.8rem;opacity:.75;margin-top:10px}
input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #ffc85755;background:#ffffff10;color:#fff;font:inherit}
select option{color:#000}
textarea{min-height:70px}
label.ck{display:flex;gap:8px;align-items:center;opacity:1;font-size:.9rem}label.ck input{width:auto}
.card{margin-top:16px;padding:16px;border-radius:16px;border:1px solid #ffc85744;background:#ffffff08}
button{padding:12px 16px;border:0;border-radius:10px;font:600 .9rem system-ui;cursor:pointer;background:#ffc857;color:#2b0a00;margin:10px 8px 0 0}
button.on{background:#2fbf71;color:#04210f}button.off{background:#ff5d73;color:#fff}button.g{background:#ffffff1a;color:#ffc857}
.b{font-size:.72rem;padding:3px 10px;border-radius:20px;background:#ffffff1a}.b.live{background:#2fbf71;color:#04210f}
.st{display:flex;gap:10px;margin-top:10px}.st div{flex:1;padding:12px;border-radius:12px;background:#ffffff10;text-align:center}.st b{display:block;font-size:1.6rem;color:#ffc857}
#msg{margin-top:12px;font-size:.9rem;color:#9bf6a0;min-height:1.2em;position:sticky;bottom:8px}
:focus-visible{outline:2px solid #ffc857}
</style></head><body>
<h1>🪔 Diya Utsav Admin</h1>

<section id="login">
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button id="li">Login</button>
</section>

<section id="panel" hidden>
  <div class="st"><div><b id="sv">0</b>Visitors</div><div><b id="sg">0</b>Gifts khule</div></div>
  <div id="secs"></div>
  <div class="card"><h3>📢 Broadcast banner</h3>
    <input id="bc" placeholder="Sabko live message… (khali = hide)">
    <button id="bs">Bhejo</button><button id="lo" class="g">Logout</button></div>
  <div id="msg" role="status"></div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* index.html wali same Firebase config yahan paste karo */
const FIREBASE_CONFIG={apiKey:"AIzaSyCYeVCVTlYXjZqEnWHfC7pAwgwKdL8hjNc",authDomain:"reelboost-ai-e3c4b.firebaseapp.com",projectId:"reelboost-ai-e3c4b",appId:"1:720458105983:web:44fb8de96c42dd87ff6b4a"};
const $=id=>document.getElementById(id);
const SEC=[['dhan','🪙 Dhanteras','2026-11-06T00:00:00+05:30','2026-11-08T00:00:00+05:30'],['diwali','🪔 Diwali','2026-11-08T00:00:00+05:30','2026-11-10T00:00:00+05:30']];
SEC.forEach(([k,t])=>$('secs').insertAdjacentHTML('beforeend',`<div class="card"><h3>${t} <span class="b" id="${k}b">…</span></h3>
<label>Status</label><select id="${k}m"><option value="auto">Auto (shuru-khatam time ke hisaab se)</option><option value="on">ABHI ON (jab tak band na karo)</option><option value="off">OFF (band)</option></select>
<label>Shuru</label><input id="${k}s" type="datetime-local">
<label>Khatam</label><input id="${k}e" type="datetime-local">
<label>Wish message</label><textarea id="${k}w"></textarea>
<label class="ck"><input type="checkbox" id="${k}go"> Is section me gift dikhao 🎁</label>
<label>Gift title</label><input id="${k}gt">
<label>Gift message</label><textarea id="${k}gx"></textarea>
<label>Gift link (project / download / video)</label><input id="${k}gl" type="url" placeholder="https://">
<label>Coupon / code</label><input id="${k}gc">
<button class="sv" data-k="${k}">💾 Save ${t}</button>
<button class="on" data-k="${k}" data-m="on">▶ ABHI ON</button><button class="off" data-k="${k}" data-m="off">⏹ OFF</button></div>`));

if(!FIREBASE_CONFIG.apiKey){document.body.insertAdjacentHTML('beforeend','<p style="color:#ff5d73">Pehle FIREBASE_CONFIG paste karo.</p>')}
else{
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),ref=db.doc('settings/main'),say=t=>{$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',3500)};
const loc=v=>{if(!v)return'';const d=new Date(v);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const iso=v=>v?new Date(v).toISOString():null,err=e=>say('❌ '+e.message);
const live=x=>x.mode=='on'||(x.mode!='off'&&Date.now()>=Date.parse(x.start)&&Date.now()<Date.parse(x.end));

function val(k){const o={mode:$(k+'m').value,wish:$(k+'w').value,gift:{on:$(k+'go').checked,title:$(k+'gt').value,text:$(k+'gx').value,link:$(k+'gl').value,code:$(k+'gc').value}};
 const s=iso($(k+'s').value),e=iso($(k+'e').value);if(s)o.start=s;if(e)o.end=e;return o}
$('li').onclick=()=>auth.signInWithEmailAndPassword($('em').value,$('pw').value).catch(e=>alert('Login fail: '+e.message));
$('lo').onclick=()=>auth.signOut();
$('bs').onclick=()=>ref.set({broadcast:$('bc').value},{merge:true}).then(()=>say('📢 Live ho gaya')).catch(err);
$('secs').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;
 if(b.dataset.m){$(k+'m').value=b.dataset.m;ref.set({[k]:{mode:b.dataset.m}},{merge:true}).then(()=>say(b.dataset.m=='on'?'▶ Live ON ho gaya':'⏹ Band ho gaya')).catch(err)}
 else ref.set({[k]:val(k)},{merge:true}).then(()=>say('✅ Save ho gaya, live update')).catch(err)};

auth.onAuthStateChanged(u=>{$('login').hidden=!!u;$('panel').hidden=!u;if(!u)return;
 ref.get().then(s=>{const d=s.exists?s.data():{};$('bc').value=d.broadcast||'';
  SEC.forEach(([k,,ds,de])=>{const x=d[k]||{},g=x.gift||{};$(k+'m').value=x.mode||'auto';$(k+'s').value=loc(x.start||ds);$(k+'e').value=loc(x.end||de);
   $(k+'w').value=x.wish||'';$(k+'go').checked=!!g.on;$(k+'gt').value=g.title||'';$(k+'gx').value=g.text||'';$(k+'gl').value=g.link||'';$(k+'gc').value=g.code||''})});
 const badge=d=>SEC.forEach(([k,,ds,de])=>{const x={mode:'auto',start:ds,end:de,...(d[k]||{})},b=$(k+'b'),l=live(x);b.textContent=l?'🟢 LIVE':'⚪ Band';b.className='b'+(l?' live':'')});
 ref.onSnapshot(s=>badge(s.data()||{}),()=>{});setInterval(()=>ref.get().then(s=>badge(s.data()||{})),30000);
 db.doc('stats/main').onSnapshot(s=>{const d=s.data()||{};$('sv').textContent=d.visits||0;$('sg').textContent=d.gifts||0},()=>{})});
}
</script></body></html>
